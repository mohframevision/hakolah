name = "hakolah-push"
main = "worker.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# بعد إنشاء KV Namespace (خطوة بالإعداد)، حط الـ id هنا
kv_namespaces = [
  { binding = "SUBSCRIPTIONS", id = "REPLACE_WITH_KV_NAMESPACE_ID" }
]

# يومياً الساعة 5:00 UTC = 8:00 صباحاً بتوقيت البحرين (UTC+3)
[triggers]
crons = ["0 5 * * *"]

[vars]
VAPID_PUBLIC_KEY = "BCPqjgTD-MkwQ7k5EQAyjf4bJUPitoDdHJndIMBWpW4HImCcC3K5BVIdsElO25kEhApg8-wqlPma6U6K9OPIgAo"
# VAPID_PRIVATE_KEY لا يُكتب هنا أبداً — يُضبط كـ secret مشفّر عبر:
#   wrangler secret put VAPID_PRIVATE_KEY
