backend:
  name: github
  repo: mohframevision/hakolah
  branch: main

media_folder: "src/assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "restaurants"
    label: "مطاعم"
    folder: "src/restaurants"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "الاسم", name: "title", widget: "string" }
      - { label: "أيقونة (إيموجي)", name: "icon", widget: "string", default: "🍽️" }
      - { label: "الوصف", name: "desc", widget: "text" }
      - label: "التصنيفات"
        name: "categories"
        widget: "list"
        field: { label: "تصنيف", name: "tag", widget: "string" }
      - label: "الروابط"
        name: "links"
        widget: "object"
        fields:
          - { label: "خرائط قوقل", name: "maps", widget: "string", required: false }
          - { label: "إنستقرام", name: "instagram", widget: "string", required: false }
          - { label: "موقع إلكتروني", name: "website", widget: "string", required: false }

  - name: "stores"
    label: "متاجر"
    folder: "src/stores"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "الاسم", name: "title", widget: "string" }
      - { label: "أيقونة (إيموجي)", name: "icon", widget: "string", default: "🛍️" }
      - { label: "الوصف", name: "desc", widget: "text" }
      - label: "التصنيفات"
        name: "categories"
        widget: "list"
        field: { label: "تصنيف", name: "tag", widget: "string" }
      - label: "الروابط"
        name: "links"
        widget: "object"
        fields:
          - { label: "خرائط قوقل", name: "maps", widget: "string", required: false }
          - { label: "إنستقرام", name: "instagram", widget: "string", required: false }
          - { label: "موقع إلكتروني", name: "website", widget: "string", required: false }

  - name: "links-tools"
    label: "روابط وأدوات مفيدة"
    folder: "src/links-tools"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "الاسم", name: "title", widget: "string" }
      - { label: "أيقونة (إيموجي)", name: "icon", widget: "string", default: "🔗" }
      - { label: "الوصف", name: "desc", widget: "text" }
      - label: "التصنيفات"
        name: "categories"
        widget: "list"
        field: { label: "تصنيف", name: "tag", widget: "string" }
      - label: "الروابط"
        name: "links"
        widget: "object"
        fields:
          - { label: "خرائط قوقل", name: "maps", widget: "string", required: false }
          - { label: "إنستقرام", name: "instagram", widget: "string", required: false }
          - { label: "موقع إلكتروني", name: "website", widget: "string", required: false }

  - name: "accounts"
    label: "حسابات واشتراكات مفيدة"
    folder: "src/accounts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "الاسم", name: "title", widget: "string" }
      - { label: "أيقونة (إيموجي)", name: "icon", widget: "string", default: "💳" }
      - { label: "الوصف", name: "desc", widget: "text" }
      - label: "التصنيفات"
        name: "categories"
        widget: "list"
        field: { label: "تصنيف", name: "tag", widget: "string" }
      - label: "الروابط"
        name: "links"
        widget: "object"
        fields:
          - { label: "خرائط قوقل", name: "maps", widget: "string", required: false }
          - { label: "إنستقرام", name: "instagram", widget: "string", required: false }
          - { label: "موقع إلكتروني", name: "website", widget: "string", required: false }

  - name: "creators"
    label: "صناع محتوى"
    folder: "src/creators"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "الاسم", name: "title", widget: "string" }
      - { label: "أيقونة (إيموجي)", name: "icon", widget: "string", default: "🎥" }
      - { label: "الوصف", name: "desc", widget: "text" }
      - label: "التصنيفات"
        name: "categories"
        widget: "list"
        field: { label: "تصنيف", name: "tag", widget: "string" }
      - label: "الروابط"
        name: "links"
        widget: "object"
        fields:
          - { label: "خرائط قوقل", name: "maps", widget: "string", required: false }
          - { label: "إنستقرام", name: "instagram", widget: "string", required: false }
          - { label: "موقع إلكتروني", name: "website", widget: "string", required: false }

  - name: "pages"
    label: "صفحات الموقع الثابتة"
    files:
      - name: "about"
        label: "عن الموقع"
        file: "src/about.md"
        fields:
          - { label: "عنوان التبويب", name: "title", widget: "string" }
          - { label: "المحتوى", name: "body", widget: "markdown" }
      - name: "privacy-policy"
        label: "سياسة الخصوصية"
        file: "src/privacy-policy.md"
        fields:
          - { label: "عنوان التبويب", name: "title", widget: "string" }
          - { label: "المحتوى", name: "body", widget: "markdown" }
